production:
  # Paid orders that never reached CJ, re-offered until they land. See the job
  # for why FulfillOrderJob own retries are not enough on their own.
  retry_supplier_failures:
    class: RetryFailedFulfillmentJob
    queue: default
    schedule: every hour at minute 24

  sync_supplier_tracking:
    class: UpdateTrackingJob
    queue: default
    schedule: every 6 hours

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
