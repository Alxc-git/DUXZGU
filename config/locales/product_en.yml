    reviews:
      - author: Maxime L.
        rating: 5
        title: It really stands out
        body: It looks far more high-end than the price suggests. The dial is crisp
          and the strap stays comfortable all day.
      - author: Sophie T.
        rating: 5
        title: The perfect gift
        body: I gave it to my partner for his birthday and he has not taken it off
          since. The box is well made, it really feels like a gift.
      - author: Karim B.
        rating: 4
        title: Great value for money
        body: Solid and easy to read, even in bright sunlight. Half a point off
          because delivery took a few days longer than expected.
    faq:
      - question: How long until I receive my watch?
        answer: Your order is packed within 24 to 48 hours. Tracked delivery then
          takes between 7 and 14 business days depending on your region.
      - question: Is the watch really water resistant?
        answer: It withstands splashes, rain and washing your hands (30M). Avoid
          the shower, the pool and diving.
      - question: Can I change the colour after ordering?
        answer: Yes, as long as the order has not shipped. Write to us and we will
          switch the colour before it leaves.
      - question: How do returns work?
        answer: You have 30 days to change your mind. The watch must be unworn and
          in its original box.
      - question: Is the battery included?
        answer: Yes, the watch ships with its battery fitted and a 2-year warranty
          on the movement.
