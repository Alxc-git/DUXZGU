en:
  legal:
    updated: "Last updated %{date}"
    questions: "Questions"
    other_policies: "Other policies"
    todo_note: "To complete"
    terms:
      title: "Terms of sale"
      h1: "1. Who you are buying from"
      p1_html: "These terms govern every order placed on this store, operated by <b>%{store}</b>. %{todo} Placing an order means you accept these terms as they read on the day of your order."
      todo1: "Add your registered company name, business number and registered address here."
      h2: "2. The product"
      p2: "We sell a food supplement. It is not a medicine and it does not treat, prevent or cure any condition. It is not intended for anyone under 18, for pregnant or breastfeeding women, or for anyone under medical supervision without advice from their doctor. Do not exceed the stated daily serving. Photography is illustrative; packaging may change."
      h3: "3. Prices and payment"
      p3: "Prices are shown in %{currency} and include applicable taxes unless stated otherwise at checkout. Shipping, where charged, is shown before you confirm. Payment is taken at the moment you confirm your order, by card through Stripe or through PayPal. We never see or store your full card number."
      p3b: "A price shown in error does not bind us. If we discover an error before dispatch we will contact you and you may confirm at the corrected price or cancel for a full refund."
      h4: "4. Your order"
      p4: "Your order is an offer to buy. The contract is formed when we send you the confirmation email. We may refuse an order — for example where stock has run out, where we cannot ship to your address, or where we suspect fraud — and will refund you in full if we do."
      h5: "5. Delivery"
      p5_html: "See our %{link} for destinations, times and costs. Risk passes to you on delivery."
      p5_link: "shipping policy"
      h6: "6. Cancelling and returning"
      p6_html: "See our %{link}. Nothing in these terms limits the statutory rights you have as a consumer."
      p6_link: "refund policy"
      h7: "7. Our liability"
      p7: "We are liable for foreseeable loss caused by our breach of these terms. We are not liable for business losses, nor for loss we could not have foreseen. Nothing here excludes liability for death or personal injury caused by our negligence, for fraud, or for anything else that cannot lawfully be excluded."
      h8: "8. Changes"
      p8: "We may change these terms. The version that applies to your order is the one published when you ordered."
      h9: "9. Law and disputes"
      p9_html: "%{todo} If something goes wrong, write to %{email} first: most problems are settled in a day."
      todo9: "State the governing law and the courts that have jurisdiction — normally the country where your company is registered."
    refunds:
      title: "Refunds & returns"
      h1: "The 30-day guarantee"
      p1_html: "If the product is not for you, tell us within <b>30 days of delivery</b> and we will refund what you paid for the goods. You do not need a reason. This is the guarantee advertised across this store, and it applies even to an opened jar — we would rather you tried it."
      h2: "How to ask"
      p2_html: "Email %{email} with your order number, which is in your confirmation email. We answer within one business day and tell you whether to return the jar or keep it. Do not send anything back before we reply: an unannounced return can arrive without a reference and cannot be matched to your order."
      h3: "Return shipping"
      p3_html: "%{todo} Where a return is our fault (wrong item, damaged, faulty) we always pay."
      todo3: "State who pays return postage — you or the customer — and give the return address."
      h4: "When you get your money"
      p4_html: "We refund to the original payment method within <b>5 business days</b> of approving the request, or of receiving the return where one was asked for. Your bank then takes its own time, usually two to five days. Shipping you originally paid is refunded when the whole order is returned; it is not refunded on a partial return."
      h5: "Damaged or wrong on arrival"
      p5: "Send us a photograph within 48 hours of delivery and we replace it or refund it in full, including shipping. Keep the packaging until we have answered."
      h6: "Cancelling before dispatch"
      p6: "Write to us before your order ships and we cancel it and refund you in full. Once it has shipped, the guarantee above takes over."
      h7: "Subscriptions"
      p7: "A subscription can be cancelled at any time from the link in any order email, or by writing to us. Cancelling stops future deliveries; a delivery already dispatched is covered by the 30-day guarantee like any other order."
      h8: "Your statutory rights"
      p8: "This guarantee is offered on top of the rights the law already gives you as a consumer, and does not replace them."
    shipping:
      title: "Shipping policy"
      h1: "Where we ship"
      p1_html: "We currently ship to <b>%{countries}</b>. If your country is not on the list, the checkout will not let you complete an order — write to us and we will tell you whether we can arrange it."
      h2: "What it costs"
      free_html: "Shipping is <b>free on every order</b>, with no minimum."
      paid_html: "Shipping is <b>%{amount}</b> per parcel."
      threshold_html: "Orders over <b>%{amount}</b> ship free."
      per_parcel: "The fee is charged once per parcel, not per item, so adding a second jar never doubles it."
      h3: "When it leaves"
      p3_html: "Orders placed on a working day before <b>%{time}</b> are prepared the same day. Orders placed after that, or at a weekend, go out on the next working day. Dispatch always follows payment confirmation — an order that has not been paid is not prepared."
      h4: "How long it takes"
      p4_html: "%{todo} These are estimates from the carrier, not guarantees. Customs, weather and public holidays can add days, and we cannot shorten them once a parcel has left."
      todo4: "State your real delivery windows per destination, for example \"Canada: 5–9 business days\"."
      h5: "Tracking"
      p5_html: "You get a tracking link by email as soon as the carrier scans your parcel. If tracking has not moved for five business days, write to %{email} and we will open an enquiry with the carrier."
      h6: "Wrong address"
      p6: "We ship to the address you enter at checkout. Check it before paying: once a parcel is with the carrier we cannot change it. A parcel returned to us because the address was wrong can be reshipped, with postage payable again."
      h7: "Lost parcels"
      p7: "If tracking shows a parcel as delivered but you have not received it, tell us within 7 days. We open an enquiry with the carrier and, once they confirm the loss, we replace or refund the order."
      h8: "Duties and taxes"
      p8_html: "%{todo}"
      todo8: "If you ship outside your own customs union, say clearly whether the customer pays import duty on delivery."
