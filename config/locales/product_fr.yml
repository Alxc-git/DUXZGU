      answer: Oui. Le tunnel conserve le paiement par carte via Stripe et le paiement PayPal.
    - question: Puis-je changer le format apres commande ?
      answer: Oui, tant que la commande n'a pas ete expediee. Ecrivez-nous avec votre reference de commande.
    - question: Les informations produit sont-elles definitives ?
      answer: Non. Cette fiche sert de base fonctionnelle; les claims, etiquettes, images et informations fournisseur doivent etre valides avant lancement public.
