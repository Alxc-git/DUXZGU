    - author: Maxime L.
      rating: 5
      title: Elle en impose
      body: Le rendu est bien plus haut de gamme que le prix ne le laisse penser.
        Le cadran est net et le bracelet est confortable toute la journee.
    - author: Sophie T.
      rating: 5
      title: Cadeau parfait
      body: Offerte a mon conjoint pour son anniversaire, il ne la quitte plus. La
        boite est soignee, ca fait vraiment cadeau.
    - author: Karim B.
      rating: 4
      title: Tres bon rapport qualite prix
      body: Solide et lisible, meme en plein soleil. Un demi-point en moins parce
        que la livraison a pris quelques jours de plus que prevu.
    faq:
    - question: En combien de temps vais-je recevoir ma montre ?
      answer: Votre commande est preparee sous 24 a 48h. La livraison suivie prend
        ensuite entre 7 et 14 jours ouvrables selon votre region.
    - question: La montre est-elle vraiment etanche ?
      answer: Elle resiste aux eclaboussures, a la pluie et au lavage des mains (30M).
        Evitez la douche, la piscine et la plongee.
    - question: Puis-je changer de couleur apres ma commande ?
      answer: Oui, tant que la commande n'a pas ete expediee. Ecrivez-nous et nous
        ajustons la couleur avant l'envoi.
    - question: Comment fonctionne le retour ?
      answer: Vous avez 30 jours pour changer d'avis. La montre doit etre non portee
        et dans sa boite d'origine.
    - question: La pile est-elle incluse ?
      answer: Oui, la montre est livree avec sa pile installee et une garantie de
        2 ans sur le mouvement.
