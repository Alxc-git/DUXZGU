fr:
  legal:
    updated: "Dernière mise à jour le %{date}"
    questions: "Questions"
    other_policies: "Autres politiques"
    todo_note: "À compléter"
    terms:
      title: "Conditions générales de vente"
      h1: "1. Avec qui vous traitez"
      p1_html: "Ces conditions régissent chaque commande passée sur cette boutique, exploitée par <b>%{store}</b>. %{todo} Passer une commande vaut acceptation de ces conditions telles qu'elles sont publiées le jour de la commande."
      todo1: "Ajoutez ici votre dénomination sociale, votre numéro d'entreprise et votre adresse de siège."
      h2: "2. Le produit"
      p2: "Nous vendons un supplément alimentaire. Ce n'est pas un médicament : il ne traite, ne prévient et ne guérit aucune affection. Il ne convient pas aux moins de 18 ans, aux femmes enceintes ou qui allaitent, ni à toute personne sous suivi médical sans l'avis de son médecin. Ne dépassez pas la portion quotidienne indiquée. Les photographies sont illustratives et l'emballage peut évoluer."
      h3: "3. Prix et paiement"
      p3: "Les prix sont affichés en %{currency} et incluent les taxes applicables sauf mention contraire au moment du paiement. Les frais de livraison, lorsqu'ils s'appliquent, sont indiqués avant la confirmation. Le paiement est prélevé au moment où vous confirmez votre commande, par carte via Stripe ou via PayPal. Nous ne voyons ni ne conservons jamais votre numéro de carte complet."
      p3b: "Un prix affiché par erreur ne nous engage pas. Si nous découvrons l'erreur avant l'expédition, nous vous contactons : vous pouvez confirmer au prix corrigé ou annuler et être remboursé intégralement."
      h4: "4. Votre commande"
      p4: "Votre commande est une offre d'achat. Le contrat est formé lorsque nous vous envoyons le courriel de confirmation. Nous pouvons refuser une commande — rupture de stock, adresse non desservie, soupçon de fraude — et vous rembourserons alors intégralement."
      h5: "5. Livraison"
      p5_html: "Consultez notre %{link} pour les destinations, les délais et les coûts. Les risques vous sont transférés à la livraison."
      p5_link: "politique de livraison"
      h6: "6. Annulation et retour"
      p6_html: "Consultez notre %{link}. Rien dans ces conditions ne limite les droits que la loi vous accorde en tant que consommateur."
      p6_link: "politique de remboursement"
      h7: "7. Notre responsabilité"
      p7: "Nous répondons des dommages prévisibles causés par un manquement à ces conditions. Nous ne répondons pas des pertes commerciales, ni des dommages que nous ne pouvions pas prévoir. Rien ici n'exclut notre responsabilité en cas de décès ou de dommage corporel causé par notre négligence, en cas de fraude, ou dans tout autre cas que la loi interdit d'exclure."
      h8: "8. Modifications"
      p8: "Nous pouvons modifier ces conditions. La version applicable à votre commande est celle publiée au moment où vous l'avez passée."
      h9: "9. Droit applicable et litiges"
      p9_html: "%{todo} Si quelque chose ne va pas, écrivez d'abord à %{email} : la plupart des problèmes se règlent en une journée."
      todo9: "Indiquez le droit applicable et les tribunaux compétents — normalement ceux du pays où votre entreprise est immatriculée."
    refunds:
      title: "Remboursements et retours"
      h1: "La garantie 30 jours"
      p1_html: "Si le produit ne vous convient pas, dites-le-nous dans les <b>30 jours suivant la livraison</b> et nous vous remboursons le montant payé pour la marchandise. Aucune justification n'est nécessaire. C'est la garantie annoncée partout sur cette boutique, et elle s'applique même à un pot entamé — nous préférons que vous ayez essayé."
      h2: "Comment en faire la demande"
      p2_html: "Écrivez à %{email} avec votre numéro de commande, qui figure dans votre courriel de confirmation. Nous répondons en un jour ouvrable et vous indiquons s'il faut renvoyer le pot ou le garder. N'envoyez rien avant notre réponse : un retour non annoncé arrive sans référence et ne peut pas être rattaché à votre commande."
      h3: "Frais de retour"
      p3_html: "%{todo} Lorsque le retour nous est imputable (mauvais article, produit endommagé ou défectueux), nous payons toujours."
      todo3: "Indiquez qui paie les frais de retour — vous ou le client — et donnez l'adresse de retour."
      h4: "Quand vous êtes remboursé"
      p4_html: "Nous remboursons sur le moyen de paiement d'origine dans les <b>5 jours ouvrables</b> suivant l'acceptation de la demande, ou la réception du retour lorsqu'il en est demandé un. Votre banque prend ensuite son propre délai, généralement de deux à cinq jours. Les frais de livraison que vous avez payés sont remboursés lorsque la commande entière est retournée ; ils ne le sont pas sur un retour partiel."
      h5: "Produit endommagé ou erroné à la réception"
      p5: "Envoyez-nous une photo dans les 48 heures suivant la livraison et nous remplaçons ou remboursons intégralement, frais de livraison compris. Conservez l'emballage jusqu'à notre réponse."
      h6: "Annulation avant expédition"
      p6: "Écrivez-nous avant l'expédition et nous annulons la commande avec remboursement intégral. Une fois expédiée, c'est la garantie ci-dessus qui prend le relais."
      h7: "Abonnements"
      p7: "Un abonnement peut être annulé à tout moment depuis le lien présent dans n'importe quel courriel de commande, ou en nous écrivant. L'annulation arrête les livraisons futures ; une livraison déjà expédiée reste couverte par la garantie 30 jours comme toute autre commande."
      h8: "Vos droits légaux"
      p8: "Cette garantie s'ajoute aux droits que la loi vous accorde déjà en tant que consommateur et ne les remplace pas."
    shipping:
      title: "Politique de livraison"
      h1: "Où nous livrons"
      p1_html: "Nous livrons actuellement en <b>%{countries}</b>. Si votre pays n'est pas dans la liste, le paiement ne vous laissera pas finaliser la commande — écrivez-nous et nous vous dirons si un arrangement est possible."
      h2: "Ce que ça coûte"
      free_html: "La livraison est <b>gratuite sur toutes les commandes</b>, sans minimum."
      paid_html: "La livraison coûte <b>%{amount}</b> par colis."
      threshold_html: "Les commandes de plus de <b>%{amount}</b> sont livrées gratuitement."
      per_parcel: "Les frais sont facturés une fois par colis, pas par article : ajouter un deuxième pot ne les double jamais."
      h3: "Quand le colis part"
      p3_html: "La préparation commence après confirmation du paiement. Le délai d'expédition dépend du stock disponible et du traitement par notre fournisseur. Les délais annoncés sont estimatifs; une date d'expédition précise ne peut être garantie avant confirmation du fournisseur. Le numéro de suivi est envoyé par courriel dès qu'il est disponible."
      h4: "Combien de temps ça prend"
      p4_html: "%{todo} Ce sont des estimations du transporteur, pas des garanties. Les douanes, la météo et les jours fériés peuvent ajouter des jours, et nous ne pouvons pas les raccourcir une fois le colis parti."
      todo4: "Indiquez vos délais réels par destination, par exemple « Canada : 5 à 9 jours ouvrables »."
      h5: "Suivi"
      p5_html: "Vous recevez un lien de suivi par courriel dès que le transporteur scanne votre colis. Si le suivi ne bouge pas pendant cinq jours ouvrables, écrivez à %{email} et nous ouvrirons une enquête auprès du transporteur."
      h6: "Adresse erronée"
      p6: "Nous expédions à l'adresse saisie au moment du paiement. Vérifiez-la avant de payer : une fois le colis chez le transporteur, nous ne pouvons plus la modifier. Un colis qui nous revient pour cause d'adresse erronée peut être réexpédié, avec des frais de port à nouveau à votre charge."
      h7: "Colis perdus"
      p7: "Si le suivi indique une livraison que vous n'avez pas reçue, signalez-le dans les 7 jours. Nous ouvrons une enquête auprès du transporteur et, une fois la perte confirmée, nous remplaçons ou remboursons la commande."
      h8: "Droits et taxes"
      p8_html: "%{todo}"
      todo8: "Si vous expédiez hors de votre union douanière, indiquez clairement si le client paie des droits d'importation à la livraison."
