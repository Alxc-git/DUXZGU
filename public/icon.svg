  <!-- The tab favicon is drawn at 16 to 32 pixels. At that size the inner ring
       and the four hour markers of the full mark close up into a smudge, so this
       variant keeps only what survives: one thick bezel, the crown, and letters
       big enough to read. icon-full.svg carries the detailed version. -->
  <g fill="url(#gold)">
    <rect x="466" y="222" width="40" height="68" rx="10"/>
    <path d="M256 16a240 240 0 100 480 240 240 0 000-480zm0 62a178 178 0 110 356 178 178 0 010-356z"/>
    <text x="254" y="320"
